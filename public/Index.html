<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视界立转新代码</title>
    <!-- 样式表 -->
    <link rel="stylesheet" type="text/css" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <!-- 引入外部库 -->
    <script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="./js/three.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style></style>
  </head>
  <body>
    <!-- 模态框 -->
    <div
      id="overlay"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9999;
      "
    >
      <div
        id="modal"
        style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgb(0, 1, 54);
          padding: 20px;
          border-radius: 5px;
        "
      >
        <p id="modal-text">请先上传人物图。</p>
        <button id="close-modal">返回</button>
      </div>
    </div>

    <!-- 历史图片画廊按钮 -->
    <a class="gallery-button" href="http://localhost:4000/pages/gallery.html"
      >历史图片画廊</a
    >

    <!-- 背景画布 -->
    <div id="canvas" class="bg"></div>

    <!-- 首页内容 -->
    <div id="top-box" class="homepage">
      <p style="font-size: 3rem">视界立转</p>
      <p>一个利用AI来画角色三视图的懒人小工具</p>
      <p>上传一张人物图，即可绘制三视图</p>
      <button id="slide-button">进入页面</button>
    </div>

    <!-- 主内容 -->
    <div id="main-content" class="hidden">
      <!-- 左侧内容 -->
      <div class="left">
        <div class="title">
          <div class="engTitle">VisTrans</div>
          <div class="cnTitle">视界立转</div>
        </div>
        <div id="sendImageContainer" style="border: #fefeff 8px solid">
          <div
            class="uploadButton"
            onclick="document.getElementById('fileInput').click()"
          >
            上传
          </div>
          <input
            type="file"
            id="fileInput"
            style="display: none"
            accept="image/*"
            onchange="uploadImage()"
          />
          <img
            id="uploadedImage"
            src="./images/default.jpg"
            alt="Uploaded Image"
          />
        </div>
      </div>

      <!-- 右侧内容 -->
      <div id="externalImageContainer" class="right">
        <button onclick="sendJsonRequest()" id="targetButton">开始生成</button>
        <div id="progressBarContainer" style="display: none">
          <div id="progressBar"></div>
        </div>
        <button id="downloadButton" onclick="downloadImage()">保存图片</button>
        <img
          id="externalImage"
          src="./images/2.png"
          alt="External Image"
          style="
            border: #fefeff 8px solid;
            min-height: 200px;
            min-width: 200px;
            object-fit: contain;
            max-height: 50vh;
            width: auto;
            max-width: 100%;
            z-index: 0;
          "
        />
      </div>
    </div>

    <!-- 脚本文件 -->
    <script src="./js/script.js"></script>
    <script src="./js/canvas.js"></script>
    <script src="./js/simplex-noise.min.js"></script>
    <script src="./js/indexPage.js"></script>
  </body>
</html>
